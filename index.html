<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MatchDay</title>
    <meta name="description" content="Próximos jogos de futebol e em que canais portugueses podem ser vistos.">
    <meta property="og:title" content="MatchDay">
    <meta property="og:description" content="Próximos jogos de futebol e em que canais portugueses podem ser vistos.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="website-icons/logo-with-text.png">
    <link rel="shortcut icon" type="image/png" href="website-icons/matchday-24.png" />
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="24x24" href="favicon-24x24.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="logo-container">
        <img src="./website-icons/logo-with-text-no-bg.png" class="logo" />
    </div>
    <div id="loader">
        <div class="spinner"></div>
    </div>
    <div id="error-message" style="display: none;">
        Não foi possível carregar os jogos. Por favor, tenta novamente mais tarde.
    </div>
    <div id="table" class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th scope="col">Data</th>
                    <th scope="col">Jogo</th>
                    <th scope="col">Canais</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
        <br>
        <div class="footer">
            <small>
                developed by Ruben Araujo
            </small>
        </div>
    </div>
    <script src="constants.js"></script>
    <script src="script.js"></script>
</body>
</html>
