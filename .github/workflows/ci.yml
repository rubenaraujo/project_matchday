name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['zapping.json', 'team-logos.json', 'badges/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint and JS tests
        run: |
          npm install
          npm run lint
          npm test
